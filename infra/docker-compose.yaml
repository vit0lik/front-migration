name: front_migration

services:
  # https://hub.docker.com/_/postgres

  postgres:
    image: postgres:16.3
    container_name: "front-postgres"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_LOGIN}
    restart: always
    ports:
     - "${POSTGRES_PORT:-15435}:5432"
    networks:
     - pgdata
    volumes: 
     - ./postgres-data:/var/lib/postgresql/data
     - ./backup:/backup

  pgadmin:
    container_name: "front-pgadmin"
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin:/var/lib/pgadmin  
      - ./scripts:/scripts 
    networks:
      - pgdata  
    restart: always
    depends_on:
      - postgres

  mssql2017:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: front-mssql2017
    hostname: front-mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_PASS}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
       - ./mssql-data:/var/opt/mssql/data
       - ./backup:/backup
    restart: always

networks:
  pgdata:

